name: Release Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar instalador
        run: npm run dist

      - name: Empacotar versão portátil
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $portable = "release/Ribbit-Frame-Portable-$version.zip"
          Compress-Archive -LiteralPath 'release/win-unpacked' -DestinationPath $portable -CompressionLevel Optimal
          if (!(Test-Path -LiteralPath "release/Ribbit-Frame-Setup-$version.exe")) { throw 'Instalador não encontrado.' }
          if (!(Test-Path -LiteralPath $portable)) { throw 'ZIP portátil não encontrado.' }

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version-build.${{ github.run_number }}"
          $installer = "release/Ribbit-Frame-Setup-$version.exe"
          $portable = "release/Ribbit-Frame-Portable-$version.zip"
          gh release create $tag $installer $portable --target $env:GITHUB_SHA --title "Ribbit Frame $version (build ${{ github.run_number }})" --notes "Build automático da branch main. Instalador Windows e versão portátil ZIP."
